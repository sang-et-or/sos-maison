name: Tests et compilation

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sos_maison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sos_maison
      APP_URL: http://localhost:3000
      ADMIN_EMAILS: admin-smoke@example.fr
      STRIPE_WEBHOOK_SECRET: whsec_smoke_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier les types
        run: npm run typecheck
      - name: Tests unitaires (sécurité, liens, crédits)
        run: npm test
      - name: Créer la base
        run: npm run db:migrate
      - name: Tests de la base de données
        run: npm run test:db
      - name: Compiler le site
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            msg=$(grep -vE '^\s*$' build.log | tail -60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compilation::$msg"
            exit 1
          fi
      - name: Démarrer et vérifier les pages
        run: |
          npm run db:seed
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          set -o pipefail
          if ! npx tsx tests/smoke.ts 2>&1 | tee smoke.log; then
            msg=$(tail -40 smoke.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test de bout en bout::$msg"
            exit 1
          fi
