name: Purge quotidienne (photos expirées, sessions)

# Remplace la tâche planifiée de Vercel quand le site est hébergé ailleurs (Render).
# Secrets du dépôt nécessaires : SITE_URL (ex. https://sos-maison.onrender.com) et CRON_SECRET.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la purge
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Site pas encore configuré : rien à faire."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 30 --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/purge"
